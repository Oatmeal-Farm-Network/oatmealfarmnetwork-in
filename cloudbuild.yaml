# India (OatmealIndia / asia-south1) — frontend image build
substitutions:
  _REGION: asia-south1
  _PROJECT_ID: oatmealindia
  _AR_REPO: cloud-run-source-deploy
  _SERVICE: oatmealfarmnetwork-in
  _API_URL: https://oatmealfarmnetworkbackend-in-151683070823.asia-south1.run.app

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}'
      - '--build-arg'
      - 'VITE_API_URL=${_API_URL}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}'

images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}'
