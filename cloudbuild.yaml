# India (asia-south1) — frontend image build for Cloud Run
# Cloud Run service name: oatmealfarmnetwork-in
substitutions:
  _REGION: asia-south1
  _PROJECT_ID: animated-flare-421518
  _AR_REPO: cloud-run-source-deploy
  _SERVICE: oatmealfarmnetwork-in
  _API_URL: https://oatmealfarmnetworkbackend-in-802455386518.asia-south1.run.app

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}'
      - '--build-arg'
      - 'VITE_API_URL=${_API_URL}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}'

  # Optional auto-deploy (enable by uncommenting after first manual Cloud Run create)
  # - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  #   entrypoint: gcloud
  #   args:
  #     - 'run'
  #     - 'deploy'
  #     - '${_SERVICE}'
  #     - '--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}'
  #     - '--region=${_REGION}'
  #     - '--platform=managed'
  #     - '--allow-unauthenticated'
  #     - '--port=8080'

images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}'
